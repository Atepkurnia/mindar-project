<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR.js Video with .patt Marker</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden;
      width: 100%; height: 100%;
      background-color: #000;
    }
  </style>
</head>
<body>
  
  <a-scene embedded arjs="sourceType: webcam;">
    
    <!-- Marker pattern sesuai file .patt Anda -->
    <a-marker type="pattern" url="pattern-marker.patt">

      <!-- Video yang akan ditampilkan di posisi marker -->
      <a-video src="#vid" position="0 0 0" rotation="-90 0 0" width="1" height="0.56"></a-video>

    </a-marker>

    <!-- Kamera -->
    <a-entity camera></a-entity>

    <!-- Video element yang dihubungkan ke a-video -->
    <video id="vid" src="video.mp4" autoplay loop muted playsinline webkit-playsinline crossorigin="anonymous" preload="auto"></video>

  </a-scene>

  <script>
    // Agar video otomatis diputar saat marker ditemukan
    const video = document.getElementById('vid');
    const scene = document.querySelector('a-scene');
    
    scene.addEventListener('markerFound', () => {
      if(video.paused) video.play().catch(() => {});
    });

    scene.addEventListener('markerLost', () => {
      if(!video.paused){
        video.pause();
        video.currentTime = 0;
      }
    });
  </script>

</body>
</html>
