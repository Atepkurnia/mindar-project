<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR.js Video with .patt Marker</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden;
      width: 100%; height: 100%;
      background-color: #000;
    }
  </style>
</head>
<body>

  <a-scene embedded arjs="sourceType: webcam;">
    <a-marker type="pattern" url="pattern-marker.patt">
      <a-video src="#video1" position="0 0 0" rotation="-90 0 0" width="1" height="0.56"></a-video>
    </a-marker>
    <a-entity camera></a-entity>

    <video id="video1" autoplay loop muted playsinline webkit-playsinline crossorigin="anonymous" preload="auto" src="video.mp4"></video>
  </a-scene>

</body>
</html>
