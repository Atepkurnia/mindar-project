<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AR-kaos Project - Video AR dengan .patt Marker</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      width: 100%; height: 100%;
      background-color: #000;
      touch-action: none;
      -webkit-user-select: none;
      -webkit-overflow-scrolling: touch;
    }
    a-scene {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      margin: 0; padding: 0;
    }
  </style>
</head>
<body>

  <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false" loading-screen="enabled: false" keyboard-shortcuts="enabled: false">

    <!-- Marker dengan pola dari file pattern-marker.patt -->
    <a-marker type="pattern" url="pattern-marker.patt">

      <!-- Video yang akan muncul di posisi marker -->
      <a-video src="#ar-video" position="0 0 0" rotation="-90 0 0" width="1" height="0.56"></a-video>

    </a-marker>

    <!-- Kamera AR -->
    <a-entity camera></a-entity>

    <!-- Elemen video asli yang dipakai sebagai sumber video AR -->
    <video id="ar-video" src="video.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous" preload="auto"></video>

  </a-scene>

  <script>
    const video = document.getElementById('ar-video');
    const marker = document.querySelector('a-marker');

    // Saat marker ditemukan, mainkan video
    marker.addEventListener('markerFound', () => {
      if(video.paused) video.play().catch(err => console.log('Error play video:', err));
    });

    // Saat marker hilang, pause dan reset video
    marker.addEventListener('markerLost', () => {
      if(!video.paused){
        video.pause();
        video.currentTime = 0;
      }
    });
  </script>

</body>
</html>
